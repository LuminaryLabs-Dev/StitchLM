[workspace]
resolver = "2"
members = ["crates/*", "apps/host", "apps/connector", "apps/host-web", "apps/connector-web", "xtask"]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.90"

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
sha2 = "0.10"
hex = "0.4"
candle = { package = "candle-core", version = "=0.11.1", default-features = false }
candle-nn = { version = "=0.11.1", default-features = false }
candle-transformers = { version = "=0.11.1", default-features = false }
safetensors = "0.8"
tracing = "0.1"
tokenizers = { version = "0.23.1", default-features = false, features = ["fancy-regex"] }
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.dev]
debug = 0
